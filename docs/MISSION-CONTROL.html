<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gokul Oils · Live Agents</title>
<style>
  :root { --bg:#070c18; --panel:#0f1728; --panel2:#0b1322; --line:#1e2b45; --text:#e6edf6; --muted:#7d93b5; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI","Nirmala UI",Tahoma,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header .brand { font-weight:600; font-size:16px; letter-spacing:-.01em; }
  .live { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .live .p { width:8px; height:8px; border-radius:50%; background:#22c55e; animation:blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  header .stats { margin-left:auto; display:flex; gap:22px; font-variant-numeric:tabular-nums; }
  header .stat b { font-size:18px; display:block; }
  header .stat span { font-size:11px; color:var(--muted); }

  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; padding:20px 22px 40px; max-width:1500px; margin:0 auto; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden; cursor:pointer; transition:box-shadow .25s, border-color .25s, transform .12s; }
  .card:hover { transform:translateY(-2px); }
  .card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c); opacity:.4; }
  .card.working { border-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 0 34px -8px var(--c); }
  .card.done { border-color:#22c55e; }
  .card.selected { outline:2px solid #fff; outline-offset:2px; }
  .head { display:flex; align-items:center; gap:9px; }
  .head .icon { width:10px; height:10px; border-radius:50%; background:var(--c); flex:none; box-shadow:0 0 10px var(--c); }
  .head .name { font-weight:600; font-size:15px; }
  .head .model { margin-left:auto; font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--line); padding:1px 8px; border-radius:5px; }
  .role { color:var(--muted); font-size:12px; margin:2px 0 12px; }

  .status { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .status .s { width:9px; height:9px; border-radius:50%; background:#3a4a63; flex:none; }
  .card.working .status .s { background:var(--c); animation:pulse 1s infinite; }
  .card.done .status .s { background:#22c55e; }
  @keyframes pulse { 50% { transform:scale(1.7); opacity:.5; } }
  .status .label { font-size:11px; font-weight:600; letter-spacing:.05em; color:var(--muted); }
  .card.working .status .label { color:var(--c); }
  .task { min-height:40px; border-left:2px solid var(--c); padding:2px 0 2px 12px; font:13px/1.45 Consolas,"Courier New",monospace; color:#c9d8ef; }
  .card.done .task { color:#7ee2a0; border-color:#22c55e; }
  .caret { display:inline-block; width:7px; height:13px; background:var(--c); vertical-align:-2px; margin-left:1px; animation:blink .8s steps(1) infinite; }

  /* drawer */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(520px,100vw); background:var(--panel2); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s ease; z-index:11; display:flex; flex-direction:column; overflow:hidden; }
  .drawer.open { transform:none; }
  .drawer .dhead { padding:20px 22px 16px; border-bottom:1px solid var(--line); }
  .drawer .dhead .row { display:flex; align-items:center; gap:10px; }
  .drawer .dhead .icon { width:12px; height:12px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); }
  .drawer .dhead .name { font-size:20px; font-weight:600; }
  .drawer .dhead .model { margin-left:auto; font-size:12px; color:var(--muted); border:1px solid var(--line); padding:2px 9px; border-radius:6px; }
  .drawer .dhead .role { color:var(--muted); margin:4px 0 12px; }
  .drawer .close { position:absolute; top:14px; right:16px; border:1px solid var(--line); background:none; color:var(--muted); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; }
  .drawer .close:hover { color:#fff; border-color:#4a5a7a; }

  .drawer .body { flex:1; overflow-y:auto; padding:18px 22px; }
  .drawer h3 { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px; }
  .drawer h3:first-child { margin-top:0; }

  /* pipeline */
  .pipe { display:flex; align-items:center; gap:0; }
  .pipe .stage { flex:1; text-align:center; font-size:11px; color:var(--muted); padding:6px 2px; border:1px solid var(--line); border-radius:6px; position:relative; }
  .pipe .stage.on { color:var(--c); border-color:var(--c); font-weight:600; }
  .pipe .arrow { color:#3a4a63; padding:0 4px; }

  /* current task */
  .now { font:13px/1.5 Consolas,monospace; color:#c9d8ef; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-height:44px; }
  .now .caret { background:var(--c); }

  /* system prompt */
  .prompt { font:12.5px/1.6 Consolas,"Courier New",monospace; color:#c3d2e8; background:#060b16; border:1px solid var(--line); border-radius:8px; padding:14px 16px; white-space:pre-wrap; word-break:break-word; }

  .done-line { color:#7ee2a0; font:13px Consolas,monospace; }
</style>
</head>
<body>
<header>
  <div class="brand">Gokul Oils · Live Agents</div>
  <div class="live"><span class="p"></span>running · click an agent</div>
  <div class="stats">
    <div class="stat"><b id="inflight">0</b><span>working now</span></div>
    <div class="stat"><b id="done">0</b><span>cards done</span></div>
  </div>
</header>

<main id="grid"></main>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="dhead">
    <button class="close" id="close">✕</button>
    <div class="row"><span class="icon" id="dicon"></span><span class="name" id="dname"></span><span class="model" id="dmodel"></span></div>
    <div class="role" id="drole"></div>
  </div>
  <div class="body">
    <h3>Where in the loop</h3>
    <div class="pipe" id="dpipe"></div>

    <h3>Doing right now</h3>
    <div class="now" id="dnow"></div>

    <h3>System prompt</h3>
    <div class="prompt" id="dprompt"></div>
  </div>
</div>

<script>
const PIPELINE = ["Spec","Design","Build","Verify","Done"];

const AGENTS = [
  { name:"Head of IT", role:"Lead / solution architect", model:"Opus", c:"#4f7cff", stage:0,
    prompt:"Talks to the owner, writes the spec (one page). Delegates to the right agent, merges only after QA PASS. Runs `npm run check`, reports cost in plain words.\n\nDone = spec approved, merged after PASS, board current, cost reported.",
    tasks:["writing the spec","dispatching builder + ui-builder","running npm run check","merging after PASS","reporting cost to owner"] },
  { name:"ux-designer", role:"Product designer", model:"Opus", c:"#a78bfa", stage:1,
    prompt:"You are the product designer for Gokul Retail, a modern retail POS for an Indian oil shop.\n\nThe standard: modern, clean, professional retail software — the craft level of Square, Toast, Shopify POS, Linear, Stripe. Not a dated gray grid, not a plain form on white. Confident composition, strong typography, one focal number (the bill total).\n\nHow you work:\n1. Keep `docs/DESIGN-SYSTEM.md` as the single source: palette, type scale, spacing, radii, shadows, components with states.\n2. Before any screen is built, produce ONE real-looking HTML mockup of it (1366x768). No build until the owner approves.\n3. Hand-off: per screen, exact layout, sizes, tokens, copy, keys and states.\n4. After build: compare the real screen to the mockup. PASS or a Must-fix list.\n\nNo production code. Do not commit.",
    tasks:["writing design tokens","mocking the billing screen","mocking the login screen","reviewing built screen vs mockup"] },
  { name:"builder", role:"Rust core engineer", model:"Sonnet", c:"#3b82f6", stage:2,
    prompt:"You are the backend engineer for Gokul Retail, a POS for an oil shop that bills 500+ times a day.\n\nBefore coding, read `CLAUDE.md`, `docs/ENGINEERING-RULES.md`, and the spec path. Build only that step.\n\nRules (never break):\n- Money is integer paise. Never floats.\n- Stock is a ledger; balance rebuilds from it.\n- Saving a bill = one SQLite transaction (bill + lines + payments + stock rows). WAL, synchronous=NORMAL.\n- Business rules in `crates/core` as plain functions with tests. No unwrap/expect in non-test code.\n- Schema changes only as new numbered migrations.\n- Expose to UI only through thin #[tauri::command] functions.\n\nWrite tests for every money/stock/GST/crash rule. Run cargo test, clippy -D warnings, typecheck. Do not commit. Do not self-approve.",
    tasks:["writing billing maths (GST split)","running cargo test","bill save = one transaction","writing migration 004"] },
  { name:"ui-builder", role:"Frontend engineer", model:"Sonnet", c:"#22c55e", stage:2,
    prompt:"You build screens for Gokul Retail. You never invent a look: you implement the approved mockup and the tokens in `docs/DESIGN-SYSTEM.md`.\n\nBefore coding, read `CLAUDE.md`, `docs/DESIGN-SYSTEM.md`, and the spec + mockup path.\n\nRules:\n- Use only the design tokens. No ad-hoc colors, spacing, fonts or shadows.\n- Keyboard-first: every action has a key; works without a mouse.\n- UI calls Tauri commands only. No business rules in components.\n- Every screen has empty, loading, error and success states.\n- Shared components live in `packages/ui`.\n\nBefore finishing, take a screenshot of the real screen and confirm it matches the mockup. Attach the screenshot path. Run typecheck, lint, test. Do not commit. Do not self-approve.",
    tasks:["building the split login screen","wiring the F10 payment dialog","building the billing grid","taking a screenshot"] },
  { name:"verifier", role:"QA gate", model:"Opus", c:"#ef4444", stage:3,
    prompt:"You are the last check before code reaches a shop that bills 500+ times a day. Your job is to find what is wrong, not to praise. You do not edit code.\n\nRead `docs/ENGINEERING-RULES.md`, `docs/DESIGN-SYSTEM.md`, the spec, and `git diff`.\n\nCheck:\n1. Does it do exactly what the spec says, including every edge case?\n2. Money: integer paise, GST and round-off correct, totals = sum of lines.\n3. Stock: every movement is a ledger row; balances rebuild.\n4. Crash safety: bill save is one transaction.\n5. Speed budgets exist and pass.\n6. Tests are real (fail when code is wrong).\n7. Run `npm run check`.\n\nTry to break it: empty bill, huge qty, two bills at once, kill mid-save.\n\nReply PASS or FAIL with file:line. Do not commit.",
    tasks:["reading the diff vs spec","trying to break the bill","running npm run check","verdict: PASS"] },
];

const grid = document.getElementById("grid");
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const inflightEl = document.getElementById("inflight");
const doneEl = document.getElementById("done");
let inflight = 0, done = 0, selected = null;

function typeInto(el, text, color){
  const caret = `<span class="caret" style="background:${color}"></span>`;
  let i = 0;
  el.innerHTML = caret;
  (function step(){
    i++;
    el.innerHTML = text.slice(0, i) + caret;
    if (i < text.length) setTimeout(step, 14 + Math.random()*26);
  })();
}

const cards = AGENTS.map((a, i) => {
  const el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--c", a.c);
  el.innerHTML = `
    <div class="head"><span class="icon"></span><span class="name">${a.name}</span><span class="model">${a.model}</span></div>
    <div class="role">${a.role}</div>
    <div class="status"><span class="s"></span><span class="label">IDLE</span></div>
    <div class="task"><span>waiting for a card</span></div>`;
  el.onclick = () => openDrawer(i);
  grid.appendChild(el);
  return { a, el, state:"idle", step:0 };
});

function setState(card, state, label){
  card.state = state;
  card.el.className = "card" + (state==="working"?" working":state==="done"?" done":"") + (selected===card.a.name?" selected":"");
  card.el.querySelector(".status .label").textContent = label;
}

function work(card){
  const task = card.a.tasks[card.step % card.a.tasks.length];
  card.step++;
  setState(card, "working", "WORKING");
  typeInto(card.el.querySelector(".task"), task, card.a.c);
  if (selected === card.a.name) typeInto(document.getElementById("dnow"), task, card.a.c);
  inflight++; inflightEl.textContent = inflight;
  card.timer = setTimeout(() => {
    setState(card, "done", "DONE");
    card.el.querySelector(".task").innerHTML = '<span class="done-line">✓ done</span>';
    if (selected === card.a.name) document.getElementById("dnow").innerHTML = '<span class="done-line">✓ done</span>';
    inflight = Math.max(0, inflight-1); inflightEl.textContent = inflight;
    if (card.a.name === "verifier"){ done++; doneEl.textContent = done; }
    card.timer = setTimeout(() => {
      setState(card, "idle", "IDLE");
      card.el.querySelector(".task").innerHTML = "<span>waiting for a card</span>";
      if (selected === card.a.name) document.getElementById("dnow").innerHTML = "<span>idle — waiting for a card</span>";
      card.timer = setTimeout(() => work(card), 600 + Math.random()*1500);
    }, 650);
  }, 1600 + Math.random()*1800);
}

function openDrawer(i){
  const card = cards[i], a = card.a;
  selected = a.name;
  cards.forEach(c => c.el.classList.remove("selected"));
  card.el.classList.add("selected");

  document.getElementById("dicon").style.background = a.c;
  document.getElementById("dicon").style.boxShadow = "0 0 12px " + a.c;
  document.getElementById("dname").textContent = a.name;
  document.getElementById("dmodel").textContent = a.model;
  document.getElementById("drole").textContent = a.role;
  document.getElementById("dprompt").textContent = a.prompt;
  drawer.style.setProperty("--c", a.c);

  const pipe = document.getElementById("dpipe");
  pipe.innerHTML = "";
  PIPELINE.forEach((s, idx) => {
    const div = document.createElement("div");
    div.className = "stage" + (idx === a.stage ? " on" : "");
    div.textContent = s;
    pipe.appendChild(div);
    if (idx < PIPELINE.length - 1){ const ar = document.createElement("span"); ar.className="arrow"; ar.textContent="›"; pipe.appendChild(ar); }
  });

  const now = document.getElementById("dnow");
  now.innerHTML = card.state === "working" ? card.el.querySelector(".task").innerHTML : (card.state === "done" ? '<span class="done-line">✓ done</span>' : "<span>idle — waiting for a card</span>");

  drawer.classList.add("open"); overlay.classList.add("open");
}
function closeDrawer(){
  selected = null;
  cards.forEach(c => c.el.classList.remove("selected"));
  drawer.classList.remove("open"); overlay.classList.remove("open");
}
document.getElementById("close").onclick = closeDrawer;
overlay.onclick = closeDrawer;

AGENTS.forEach((_, i) => setTimeout(() => work(cards[i]), i * 280));
</script>
</body>
</html>
