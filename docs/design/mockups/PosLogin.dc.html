<div style="width:1366px;height:768px;box-sizing:border-box;overflow:hidden;font-family:'Noto Sans','Noto Sans Tamil',sans-serif;background:#FBF7EF;color:#1F1A14;display:flex;flex-direction:column">
<div style="height:40px;flex:none;background:#3B2A1A;color:#F5E9D2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px"><b style="font-size:16px;color:#F2B84B">Gokul Oils - POS</b><div style="display:flex;gap:24px"><span>Not signed in</span><span>06 Nov 2026, 11:50 PM</span><span style="color:#9BE0B5">Backup OK 11:30 PM</span></div></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center">
<div style="width:560px;background:#FFFFFF;border:1px solid #D9CBB0;border-radius:10px;padding:28px 36px">
<div style="font-size:28px;font-weight:700">Sign in to the counter</div>
<div style="font-size:15px;color:#5A4A38;margin:4px 0 18px">Choose your name, then type your PIN.</div>
<div style="font-size:14px;font-weight:600;margin-bottom:6px">Who is billing?</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">
<div style="background:#FFF1D6;box-shadow:inset 4px 0 0 #C8861A;color:#1F1A14;padding:10px 16px;border-radius:4px;display:flex;justify-content:space-between;font-size:18px"><b>Ravi Kumar</b><span style="font-size:14px">Cashier</span></div>
<div style="border:1px solid #D9CBB0;padding:10px 16px;border-radius:4px;display:flex;justify-content:space-between;font-size:18px"><span>Anu</span><span style="font-size:14px;color:#5A4A38">Cashier</span></div>
<div style="border:1px solid #D9CBB0;padding:10px 16px;border-radius:4px;display:flex;justify-content:space-between;font-size:18px"><span>Gokul</span><span style="font-size:14px;color:#5A4A38">Owner</span></div>
</div>
<label for="pin" style="font-size:14px;font-weight:600">PIN</label>
<input id="pin" type="password" value="1234" style="display:block;width:100%;box-sizing:border-box;height:52px;margin:6px 0 6px;font-size:24px;letter-spacing:8px;padding:0 14px;border:2px solid #C8861A;border-radius:6px;outline:3px solid #F2D9A6;font-family:inherit;color:#1F1A14">
<div style="font-size:14px;color:#B3261E;min-height:20px">Wrong PIN. Type it again - 2 tries left.</div>
<button type="button" style="width:100%;height:52px;margin-top:10px;background:#C8861A;color:#1F1A14;border:0;border-radius:6px;font-size:18px;font-weight:700;font-family:inherit">Sign in  (Enter)</button>
<div style="margin-top:14px;font-size:13px;color:#5A4A38;text-align:center"><b style="border:1px solid #8A6A3A;border-radius:4px;padding:1px 6px;font-size:12px">Up</b> <b style="border:1px solid #8A6A3A;border-radius:4px;padding:1px 6px;font-size:12px">Down</b> choose name &nbsp; <b style="border:1px solid #8A6A3A;border-radius:4px;padding:1px 6px;font-size:12px">Tab</b> PIN &nbsp; <b style="border:1px solid #8A6A3A;border-radius:4px;padding:1px 6px;font-size:12px">Enter</b> sign in</div>
</div>
