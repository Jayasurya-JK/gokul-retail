[workspace]
resolver = "2"
members = ["crates/core", "apps/pos/src-tauri", "apps/office/src-tauri"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind" # a panic in one call must not take the whole app (and the shop) down
strip = true

# Dependencies (SQLite, argon2) are compiled optimised even in debug/test builds,
# otherwise PIN hashing and the 100k-bill tests are painfully slow.
[profile.dev.package."*"]
opt-level = 3
[profile.test.package."*"]
opt-level = 3
