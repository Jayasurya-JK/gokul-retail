[package]
name = "gokul-core"
description = "Gokul Retail core: database, stock ledger and business rules. No UI/Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# PIN hashing is required by spec 00 step 3. argon2 re-exports password-hash and OsRng.
argon2 = { version = "0.5", features = ["std"] }
# Wipes PINs from memory when dropped.
zeroize = "1"

[dev-dependencies]
# Tests only: checks the exact JSON the UI receives. Already in the build via Tauri.
serde_json = "1"
