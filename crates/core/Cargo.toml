[package]
name = "gokul-core"
version = "0.1.0"
edition = "2021"
description = "Gokul Retail business rules and SQLite database (no Tauri dependency)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
gokul-print = { path = "../print" }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
